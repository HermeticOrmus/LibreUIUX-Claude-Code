name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Install the Grok Build CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
      - name: Repo checks
        run: bash scripts/check.sh
      # A PR can loosen its own check.sh. Run the base branch's copy on the same tree too.
      # A PR that moves a file the base copy names lands the check.sh change first, in its
      # own PR.
      - name: Repo checks, base branch copy
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE_REF"
          if ! git cat-file -e FETCH_HEAD:scripts/check.sh 2>/dev/null; then
            echo "The base branch has no scripts/check.sh yet, so there is no base copy to run."
            exit 0
          fi
          git show FETCH_HEAD:scripts/check.sh > scripts/check.sh
          bash scripts/check.sh
